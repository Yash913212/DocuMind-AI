<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30" />
      <stop offset="100%" stop-color="#161618" />
    </linearGradient>
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D0D0D6" />
      <stop offset="100%" stop-color="#8E8E96" />
    </linearGradient>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D42" />
      <stop offset="60%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#favBg)" stroke="rgba(192, 192, 192, 0.25)" stroke-width="1.2" />

  <!-- D Spine -->
  <rect x="17" y="16" width="6.5" height="32" rx="3.25" fill="url(#favSilver)" />

  <!-- D Outer Arc -->
  <path d="M 23.5 19 H 34 C 42.5 19 48 24.5 48 32 C 48 39.5 42.5 45 34 45 H 23.5" 
        fill="none" stroke="url(#favSilver)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Signal Red Neural Core -->
  <circle cx="34" cy="32" r="5.5" fill="url(#favRed)" filter="url(#favGlow)" />
  <circle cx="34" cy="32" r="2.2" fill="#FFFFFF" />
</svg>
